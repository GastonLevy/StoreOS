name: Deploy StoreOS to VPS

on:
  push:
    branches:
      - release/vps-ready

env:
  IMAGE_NAME: ghcr.io/gastonlevy/storeos

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t $IMAGE_NAME:release-vps-ready .

      - name: Push image
        run: docker push $IMAGE_NAME:release-vps-ready

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /root/infra/StoreOS

            docker compose pull
            docker compose up -d
